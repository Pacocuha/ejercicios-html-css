<!DOCTYPE html>


<head>
     <title>
           REGISTRO DE INSCRIPCION.
    </title>

<style>
 .formulario {
    border: 2px solid black;
    width: 350px;
    padding: 20px;
    margin: 20px;
}
</style>


</head>

<body>

     <div class="formulario">
          <h1>REGISTRO DE INSCPRICIÓN.</h1>
          <br><br>  

          <form action="Registro.html" method="get">


               <label for="nombre">Nombre y Apellidos</label>
               <input type="text" id="nombre" name="nombre" required></input>
               <br><br>

               <label for="dni">DNI</label>
               <input type="text" id="dni" name="dni" required></input>
               <br><br>    

               <label for="fecha">Fecha de nacimiento</label>
               <input type="text" id="fecha" name="fecha" required></input>
               <br><br>

               <label for="correo">Correo Electrónico</label>
               <input type="email" id="correo" name="correo" required></input>
               <br><br>

               <label for="telefono">Teléfono</label>
               <input type="tel" id="telefono" name="telefono" required></input>
               <br><br>

               <label for="ciclo">Ciclo Formativo</label>
               <input type="text" id="ciclo" name="ciclo" required></input>
               <br><br>
               <br><br>

               <label for="turno">Turno Preferido</label>
               <br><br>

               <label for="manana">Mañana</label>
               <input type="radio" id="manana" name="turno" value="mañana" required></input>

               <label for="tarde">Tarde</label>
               <input type="radio" id="tarde" name="turno" value="tarde" required></input>
               <br><br>

               <label for="modalidad">Modalidad</label>
               <br><br>

               <label for="presencial">Presencial</label>
               <input type="radio" id="presencial" name="modalidad" value="presencial" required></input>

               <label for="semipresencial">Semipresencial</label>
               <input type="radio" id="semipresencial" name="modalidad" value="semipresencial" required></input>

               <label for="online">On line</label>
               <input type="radio" id="online" name="modalidad" value="online"required></input>
               <br><br>

               <input type="submit" value="Registrar">

          </form>

          

    

     </div>
    
</body>

</html>
